services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ace
      POSTGRES_USER: ace
      POSTGRES_PASSWORD: ace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ace"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ace-postgres:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      ACE_DATABASE_URL: jdbc:postgresql://database:5432/ace
      ACE_DATABASE_USER: ace
      ACE_DATABASE_PASSWORD: ace
      ACE_INGESTION_KEY: ${ACE_INGESTION_KEY:-ace-local-development-key}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ACE_BACKEND_PORT:-8090}:8080"

  frontend:
    build: ./frontend
    environment:
      ACE_API_URL: http://backend:8080
      ACE_INGESTION_KEY: ${ACE_INGESTION_KEY:-ace-local-development-key}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  ace-postgres:
